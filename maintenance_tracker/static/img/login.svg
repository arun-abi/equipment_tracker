<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="Electrical distribution panel with a lightning bolt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17395c"/>
      <stop offset="1" stop-color="#1f4e79"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="url(#bg)"/>

  <!-- soft background circles -->
  <circle cx="500" cy="90" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="80" cy="640" r="170" fill="#ffffff" opacity="0.05"/>

  <!-- power line -->
  <path d="M0 120 Q150 90 300 120 T600 120" fill="none" stroke="#8fb4d9" stroke-width="3" opacity="0.6"/>
  <path d="M0 150 Q150 120 300 150 T600 150" fill="none" stroke="#8fb4d9" stroke-width="3" opacity="0.35"/>

  <!-- panel body -->
  <rect x="130" y="210" width="340" height="380" rx="16" fill="#dfe6ee"/>
  <rect x="146" y="226" width="308" height="348" rx="10" fill="#f4f7fa"/>

  <!-- gauge -->
  <circle cx="300" cy="300" r="52" fill="#ffffff" stroke="#1f4e79" stroke-width="6"/>
  <path d="M258 318 A46 46 0 0 1 342 318" fill="none" stroke="#1e8449" stroke-width="8" stroke-linecap="round"/>
  <path d="M300 300 L328 276" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="6" fill="#1d2733"/>

  <!-- breaker rows -->
  <g fill="#1f4e79">
    <rect x="176" y="388" width="36" height="64" rx="5"/>
    <rect x="224" y="388" width="36" height="64" rx="5"/>
    <rect x="272" y="388" width="36" height="64" rx="5"/>
    <rect x="320" y="388" width="36" height="64" rx="5"/>
    <rect x="368" y="388" width="36" height="64" rx="5"/>
  </g>
  <g fill="#ffffff">
    <rect x="184" y="396" width="20" height="24" rx="3"/>
    <rect x="232" y="396" width="20" height="24" rx="3"/>
    <rect x="280" y="420" width="20" height="24" rx="3"/>
    <rect x="328" y="396" width="20" height="24" rx="3"/>
    <rect x="376" y="396" width="20" height="24" rx="3"/>
  </g>
  <g fill="#1e8449">
    <circle cx="194" cy="470" r="5"/><circle cx="242" cy="470" r="5"/>
    <circle cx="338" cy="470" r="5"/><circle cx="386" cy="470" r="5"/>
  </g>
  <circle cx="290" cy="470" r="5" fill="#c0392b"/>

  <!-- bottom indicator strip -->
  <rect x="176" y="500" width="228" height="48" rx="8" fill="#e6ecf2"/>
  <rect x="190" y="518" width="90" height="12" rx="6" fill="#1f4e79" opacity="0.8"/>
  <rect x="290" y="518" width="60" height="12" rx="6" fill="#f5a623"/>

  <!-- lightning bolt -->
  <path d="M470 60 L395 205 H445 L405 330 L525 160 H468 L505 60 Z" fill="url(#bolt)" stroke="#fff3b0" stroke-width="3" stroke-linejoin="round" transform="translate(-120 -20) scale(0.9)"/>

  <!-- caption -->
  <text x="300" y="640" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Maintenance Tracker</text>
  <text x="300" y="672" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#cfe0f1">Equipment · PM schedule · Fault history</text>
</svg>
